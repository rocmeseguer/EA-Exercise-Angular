<!-- ============================================ -->
<!-- DATA BINDING EXAMPLES IN THIS TEMPLATE       -->
<!-- ============================================ -->
<!--
     ANGULAR MATERIAL - <mat-card>
     - <mat-card-header>: title and subtitle
     - <mat-card-content>: main content
     - <mat-card-footer>: bottom area
-->

<mat-card appearance="outlined" class="item-card">
    <mat-card-header>
        <!-- PROPERTY BINDING - Logic to View -->
        <!-- [class.completed] / [class.pending] apply CSS classes conditionally -->
        <mat-icon mat-card-avatar
                  [class.completed]="todo().completed"
                  [class.pending]="!todo().completed">
            {{ todo().completed ? 'check_circle' : 'schedule' }}
        </mat-icon>

        <!-- INTERPOLATION - Logic to View -->
        <!-- {{ }} displays component properties in the template -->
        <mat-card-title>{{ todo().title | uppercase }}</mat-card-title>

        <!-- INTERPOLATION - Displaying computed values -->
        <mat-card-subtitle>ID: {{ todo().id }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p><strong>Usuario:</strong> {{ todo().userId ? todo().userId : 'No asignado' }}</p>

        <p><strong>Estado:</strong>
            <span [class.completed]="todo().completed" [class.pending]="!todo().completed">
                <!-- INTERPOLATION - Ternary operator in template -->
                {{ todo().completed ? 'Completado' : 'Pendiente' }}
            </span>
        </p>

        <!-- INTERPOLATION - Using date pipe -->
        <p><strong>Last Updated:</strong> {{ today | date:'short' }}</p>
    </mat-card-content>
</mat-card>
